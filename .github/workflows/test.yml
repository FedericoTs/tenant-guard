name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      # Installs the dev-only pglite (embedded Postgres) so the runtime RLS proof
      # actually runs in CI instead of skipping. The shipped guards stay zero-dep;
      # pg is an optional peer and is not installed here.
      - run: npm ci
      - run: node --test
      # dogfood: the static guards must pass against this repo's own tree.
      # (examples/leaky-demo is MEANT to fail, so it is not the target here.)
      - run: node bin/tenant-guard.mjs run

  # The composite action can only be verified by actually running it on a
  # runner — none of the unit tests exercise the YAML, the shell, or the
  # step wiring. `uses: ./` runs the action from this checkout.
  action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - id: guard
        uses: ./
        with:
          command: run

      - name: The action must report its results through its outputs
        run: |
          set -euo pipefail
          echo "result=${{ steps.guard.outputs.result }}"
          echo "exit-code=${{ steps.guard.outputs.exit-code }}"
          test "${{ steps.guard.outputs.result }}" = "pass"
          test "${{ steps.guard.outputs.exit-code }}" = "0"
          # Both artifacts must exist and be parseable, or the SARIF upload and
          # anything downstream is silently working with nothing.
          test -s "${{ steps.guard.outputs.sarif-file }}"
          test -s "${{ steps.guard.outputs.json-file }}"
          node -e "
            const fs = require('fs');
            const s = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            if (s.version !== '2.1.0') throw new Error('bad SARIF version: ' + s.version);
            const j = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            if (j.schemaVersion !== 1) throw new Error('bad JSON schemaVersion: ' + j.schemaVersion);
            // This repo has no migrations or API routes, so every static guard
            // skips — and the run must say so rather than claim a pass.
            if (j.summary.skipped === 0) throw new Error('expected skips to be reported');
            console.log('artifacts OK:', j.summary.skipped, 'skips recorded');
          " "${{ steps.guard.outputs.sarif-file }}" "${{ steps.guard.outputs.json-file }}"

      # A guard failure must NOT abort the step — the SARIF and summary still
      # have to be produced. Proven against examples/leaky-demo, which leaks.
      - id: leaky
        uses: ./
        with:
          command: run
          working-directory: examples/leaky-demo
          fail-on-error: false
          upload-sarif: false

      - name: A failing run still reports, and still says it failed
        run: |
          set -euo pipefail
          test "${{ steps.leaky.outputs.result }}" = "fail"
          test "${{ steps.leaky.outputs.exit-code }}" = "1"
          node -e "
            const j = JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'));
            if (j.summary.failed !== 3) throw new Error('expected 3 failed guards, got ' + j.summary.failed);
            console.log('leaky demo reported', j.summary.failed, 'failures as expected');
          " "${{ steps.leaky.outputs.json-file }}"

  # The Action's RUNTIME path — install-pg, pg resolving from the action's own
  # prefix, connecting, and the runtime guards actually running. None of that is
  # exercised by the `action` job above (which is static-only) or by any unit
  # test, and all three Action bugs so far lived in exactly this kind of gap.
  action-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']

    env:
      DB_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v5

      # A two-tenant schema with a REAL leak in it: invoices has a tenant column,
      # is granted to the app role, and has NO row-level security at all.
      - name: Seed a leaky two-tenant database
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
            create role anon nologin;
            create role authenticated nologin;
            grant usage on schema public to anon, authenticated;
            create table invoices (id serial primary key, organization_id text not null, amount int);
            insert into invoices (organization_id, amount) values ('org_A', 100), ('org_B', 200);
            grant select on invoices to authenticated;
          SQL

      - id: guard
        uses: ./
        with:
          command: all
          database-url: ${{ env.DB_URL }}
          fail-on-error: false   # the seed leaks on purpose
          upload-sarif: false

      - name: The runtime guards must have RUN, and found the planted leak
        run: |
          set -euo pipefail
          test "${{ steps.guard.outputs.result }}" = "fail"
          node -e "
            const j = JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'));
            const proof = j.guards.find(g => g.id === 'rls-proof');
            if (!proof) throw new Error('rls-proof missing from the results');
            // The whole point: a skip here means install-pg or the database-url
            // wiring is broken and every runtime guard silently did nothing.
            if (proof.status === 'skip') throw new Error('rls-proof SKIPPED — ' + proof.reason);
            if (j.summary.violations === 0) throw new Error('the planted leak was not reported');
            console.log('runtime path OK:', j.summary.ran, 'guards ran,', j.summary.violations, 'violation(s)');
          " "${{ steps.guard.outputs.json-file }}"
